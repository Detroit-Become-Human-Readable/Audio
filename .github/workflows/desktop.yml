name: Desktop
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build DetroitAudio.slnx -c Release -p:AutoPublish=false
      - run: dotnet test DetroitAudio.slnx -c Release --no-build -p:AutoPublish=false
      - shell: pwsh
        run: ./scripts/Test-AutoPublishExit.ps1
      - shell: pwsh
        run: ./scripts/Test-Publish.ps1
      - shell: powershell
        run: ./scripts/Test-Publish.ps1
      - run: dotnet run --project tools/DetroitAudio.UiCheck -c Release --no-build -- artifacts/ui-check
      - uses: actions/upload-artifact@v4
        with:
          name: ui-check
          path: artifacts/ui-check/browser.png
